## Flox Environment Manifest -----------------------------------------
##
##   Reference: https://flox.dev/docs/reference/command-reference/manifest.toml/
##   Enter with `flox activate`. See "Build, test, lint" in AGENTS.md.
##
## -------------------------------------------------------------------
schema-version = "1.13.0"

[install]
# Pin the Go minor series. The lockfile records the exact patch release;
# `flox upgrade` moves within 1.26.x only.
go.pkg-path = "go"
go.version = "1.26"
# staticcheck lives in the nixpkgs package called go-tools.
go-tools.pkg-path = "go-tools"
govulncheck.pkg-path = "govulncheck"
gopls.pkg-path = "gopls"
# The race detector needs cgo, and so a C compiler, on Linux. macOS is
# cgo-free, so gcc is installed for the Linux systems only.
gcc.pkg-path = "gcc"
gcc.systems = ["aarch64-linux", "x86_64-linux"]

[vars]
# Stop the go command from downloading a different toolchain when go.mod
# asks for a newer Go. This manifest is the only source of the toolchain.
GOTOOLCHAIN = "local"
# Static binaries. scripts/check.sh re-enables cgo for one step only: the
# race detector on Linux.
CGO_ENABLED = "0"

[options]
# macOS on Apple silicon for development, Linux for CI runners.
# x86_64-darwin is omitted: the catalog does not publish current Go for it.
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
