# LocalClaw topology. The three roles are fixed; edit sizes and workload
# lists. Workloads are applied in the order listed and torn down in reverse.
# cpus, memory-mib and disk-gib map onto `podman machine init --cpus`,
# `--memory` and `--disk-size`. The schema is documented in
# docs/reference/scaffold.md of the LocalClaw repository.
schema = 1
provider = "libkrun"

# The keychain holding the secrets lclaw injects into the machines.
# `lclaw init` creates it; `lclaw secrets` manages its items. Point this at
# login.keychain-db to use the login keychain instead.
[keychain]
path = "~/Library/Keychains/lclaw.keychain-db"

[machines.infra]
cpus = 1
memory-mib = 1024
disk-gib = 10
workloads = ["wireguard", "kuma-cp", "gateway"]

[machines.services]
cpus = 2
memory-mib = 4096
disk-gib = 30
workloads = ["litellm-db", "litellm", "agentgateway"]
# Secrets this machine receives, by keychain item name. The built-in
# entries are always available; list only the keys you supply yourself.
# Set each one with `lclaw secrets set <name>`.
secrets = ["anthropic-api-key"]

[machines.agent]
cpus = 2
memory-mib = 4096
disk-gib = 30
workloads = ["openclaw"]
# Host directories to mount into the machine, as "host:guest" pairs. Empty by
# default: nothing on the host is visible to the agent unless listed here.
# volumes = ["/Users/me/workspace:/mnt/workspace"]
