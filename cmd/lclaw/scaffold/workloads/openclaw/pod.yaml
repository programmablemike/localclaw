# LocalClaw: OpenClaw agent. State lives in the openclaw-state volume; the
# gateway token comes from the openclaw-gateway-token secret by name.
#
# This is the untrusted workload, and it shares the machine's kernel with
# the other zones, so the pod carries what its own VM used to provide: every
# capability dropped, no privilege escalation, and a resource ceiling. lclaw
# up also plays it with --userns auto because its zone is internal.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-state
---
apiVersion: v1
kind: Pod
metadata:
  name: openclaw
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/part-of: localclaw
spec:
  restartPolicy: Always
  containers:
    - name: openclaw
      image: localhost/lclaw/openclaw:latest
      imagePullPolicy: Never
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
      ports:
        - containerPort: 18789
      env:
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: openclaw-gateway-token
              key: value
      volumeMounts:
        - name: state
          mountPath: /home/node/.openclaw
  volumes:
    - name: state
      persistentVolumeClaim:
        claimName: openclaw-state
