# LocalClaw: WireGuard server pod (provisional until the network design
# lands). Applied with `podman kube play`; docs/reference/scaffold.md lists
# the conventions every Pod file keeps. Needs NET_ADMIN and the wireguard
# kernel module on the machine.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wireguard-config
---
apiVersion: v1
kind: Pod
metadata:
  name: wireguard
  labels:
    app.kubernetes.io/name: wireguard
    app.kubernetes.io/part-of: localclaw
spec:
  restartPolicy: Always
  containers:
    - name: wireguard
      image: localhost/lclaw/wireguard:latest
      imagePullPolicy: Never
      resources:
        limits:
          cpu: "1"
          memory: 256Mi
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
      env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: Etc/UTC
      ports:
        - containerPort: 51820
          hostPort: 51820
          protocol: UDP
      volumeMounts:
        - name: config
          mountPath: /config
  volumes:
    - name: config
      persistentVolumeClaim:
        claimName: wireguard-config
