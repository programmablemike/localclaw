# A valid topology with every field, including the optional volumes list.
schema = 2
provider = "libkrun"

[keychain]
path = "~/Library/Keychains/lclaw.keychain-db"

[machine]
cpus = 4
memory-mib = 8192
disk-gib = 60
volumes = ["/Users/me/workspace:/mnt/workspace"]

[zones.infra]
workloads = ["kuma-cp", "gateway"]
bridges = { kuma-cp = ["services", "agent"] }

[zones.services]
workloads = ["litellm-db", "litellm", "agentgateway"]
bridges = { agentgateway = ["agent"] }
secrets = ["anthropic-api-key"]

[zones.agent]
internal = true
workloads = ["openclaw"]
